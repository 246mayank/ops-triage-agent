name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          set -euo pipefail
          pip install -e ".[dev]"
      - name: Lint
        run: |
          set -euo pipefail
          ruff check .
      - name: Incidents match the generator
        run: |
          set -euo pipefail
          triage build-incidents --check
          triage build-incidents
          git diff --exit-code incidents/
      - name: Tests (recordings only, no API key)
        env:
          GEMINI_API_KEY: ""
        run: |
          set -euo pipefail
          pytest -q
