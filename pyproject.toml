[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-triage-agent"
version = "0.1.0"
description = "LLM agent that diagnoses data-pipeline failure alerts with grounded, quoted evidence"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0",
  "pydantic>=2.6",
  "typer>=0.12",
  "pyyaml>=6",
  "httpx>=0.27",
  "regex>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
triage = "triage.cli:app"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["triage*", "sandbox*", "eval*"]

[tool.setuptools.package-data]
triage = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer.Option in defaults is the typer idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
